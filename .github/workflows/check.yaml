name: Check Templates

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repository
        uses: actions/checkout@v6

      - name: Setup Whiskers
        uses: catppuccin/setup-whiskers@v2

      - name: Check Templates
        run: make check
